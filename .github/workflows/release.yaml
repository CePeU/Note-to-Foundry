name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use for release"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"

      - name: Build plugin
        run: |
          npm ci --ignore-scripts
          npm run test:unit
          npm run package

      - name: Zip output
        working-directory: dist/release
        run: |
          zip -r notetofoundry.zip notetofoundry

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title="Release $RELEASE_TAG" \
            --draft \
            dist/release/notetofoundry/main.js \
            dist/release/notetofoundry/manifest.json \
            dist/release/notetofoundry/styles.css \
            dist/release/notetofoundry/secret.svg \
            dist/release/notetofoundry.zip
