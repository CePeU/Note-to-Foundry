name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use for release"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          # Manual releases build the requested existing tag, just like tag-triggered releases.
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 12
        # npm 12 applies package.json's allowScripts policy: esbuild is allowed, Electron's download is disabled.
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        # Packaging compiles TypeScript and styles; tests are run only in the local repository.
        run: npm run package

      - name: Zip output
        working-directory: dist/release
        run: |
          zip -r notetofoundry.zip notetofoundry

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title="Release $RELEASE_TAG" \
            --verify-tag \
            --draft \
            dist/release/notetofoundry/main.js \
            dist/release/notetofoundry/manifest.json \
            dist/release/notetofoundry/styles.css \
            dist/release/notetofoundry/secret.svg \
            dist/release/notetofoundry.zip
